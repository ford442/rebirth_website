name: Archive health

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: archive-health
  cancel-in-progress: true

jobs:
  integrity:
    name: Verify local-core hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check archive integrity
        run: python3 scripts/check-archive-integrity.py

  link-rot:
    name: HEAD-sweep remote URLs
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Python requests
        run: python3 -m pip install --quiet requests
      - name: Sweep sample of remote archive URLs
        id: sweep
        run: |
          set +e
          python3 scripts/check-link-rot.py --sample 40 --kind all > /tmp/link-rot.txt 2> /tmp/link-rot.err
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/link-rot.err
          cat /tmp/link-rot.txt
        continue-on-error: true
      - name: Open or update health issue
        if: steps.sweep.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(printf 'Scheduled link-rot sweep found dead remotes.\n\n```\n%s\n%s\n```\n' "$(cat /tmp/link-rot.err)" "$(cat /tmp/link-rot.txt)")"
          existing="$(gh issue list --label archive-health --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Archive link rot detected" --body "$body"
          fi
