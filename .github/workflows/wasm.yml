name: WASM Build

on:
  pull_request:
    paths:
      - 'src/wasm/**'
      - '.github/workflows/wasm.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/wasm/**'
      - '.github/workflows/wasm.yml'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # Nightly at 06:00 UTC
    - cron: '0 6 * * *'

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM and run engine tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version-file: src/wasm/cpp/.emscripten-version
          cache: true

      - name: Build WASM (release)
        run: npm run wasm:build

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: WASM Playwright tests (preview server)
        run: npx playwright test tests/wasm-assets.spec.ts tests/wasm-engine.spec.ts
        env:
          CI: true
          WASM_BUILT: '1'

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build-${{ github.run_number }}
          path: public/wasm/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
