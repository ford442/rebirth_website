        - generic [ref=e240]:
          - article [ref=e241]:
            - generic [ref=e243]: WHAT IS REBIRTH?
            - paragraph [ref=e245]:
              - text: Released by Propellerhead Software in
              - strong [ref=e246]: "1997"
              - text: ","
              - strong [ref=e247]: ReBirth RB-338
              - text: was one of the first software synthesizers to faithfully emulate the
              - strong [ref=e248]: Roland TB-303
              - text: Bass Line and the Roland TR-808 / TR-909 drum machines. It became a cornerstone of electronic music production and is now freely available as abandonware.
          - article [ref=e249]:
            - generic [ref=e251]: WHAT IS THIS SITE?
            - paragraph [ref=e253]:
              - text: This community archive preserves
              - code [ref=e254]: .rbs
              - text: song files and
              - code [ref=e255]: .rbm
              - text: mod files contributed by enthusiasts worldwide. It also hosts historical documentation spanning versions
              - code [ref=e256]: "1.0"
              - text: through
              - code [ref=e257]: 2.0.1
              - text: and lays the groundwork for in-browser
              - code [ref=e258]: .rbs
              - text: preview via WebAssembly.
          - article [ref=e259]:
            - generic [ref=e261]: HOW TO CONTRIBUTE?
            - paragraph [ref=e263]:
              - text: Open a pull request on the
              - link "GitHub repository" [ref=e264] [cursor=pointer]:
                - /url: https://github.com/ford442/rebirth_website
              - text: . Place song files in
              - code [ref=e265]: public/archive/rbs-songs/
              - text: and mod files in
              - code [ref=e266]: public/archive/rbm-mods/
              - text: . See the
              - link "documentation" [ref=e267] [cursor=pointer]:
                - /url: /rb338/docs
              - text: for naming conventions and metadata requirements.
