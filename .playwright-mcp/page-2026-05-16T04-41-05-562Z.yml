          - generic [ref=e32]: THE DIGITAL ACID REVOLUTION
          - generic [ref=e35]: ARCHIVAL ANALYSIS
        - generic [ref=e36]:
          - paragraph [ref=e37]:
            - text: An exhaustive study of Propellerhead ReBirth RB-338 and the
            - code [ref=e38]: .rbs
            - text: musical ecosystem
          - generic [ref=e39]:
            - generic [ref=e40]:
              - generic [ref=e41]: "1996"
              - generic [ref=e42]: Origin
            - generic [ref=e43]:
              - generic [ref=e44]: 3,604+
